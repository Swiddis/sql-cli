[package]
name = "ppl-dev-cli"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "ppl"
path = "src/main.rs"

[profile.release]
lto = true
panic = "abort"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
colored_json = "5.0"
tabled = "0.20"
